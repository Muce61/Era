name: Stage 0 quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Apply deterministic Ruff fixes
        run: |
          uv run ruff format src/era100x/research/stage_2/baselines/conditional/receipt_supplement.py
          uv run ruff check --fix src/era100x/foundation/governance/current_state.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/era100x/research/stage_2/baselines/conditional/receipt_supplement.py \
              src/era100x/foundation/governance/current_state.py
            git commit -m "style(stage2): apply Ruff fixes"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run the repository quality gate
        id: quality
        continue-on-error: true
        run: uv run python scripts/run_quality_gate.py > quality-gate.log 2>&1
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-log
          path: quality-gate.log
          if-no-files-found: error
      - name: Fail when the quality gate failed
        if: steps.quality.outcome == 'failure'
        run: exit 1
