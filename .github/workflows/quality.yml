name: Stage 0 quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Install locked development environment
        run: uv sync --locked --all-groups
      - name: Run the repository quality gate
        id: quality
        continue-on-error: true
        run: uv run python scripts/run_quality_gate.py > quality-gate.log 2>&1
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-log
          path: quality-gate.log
          if-no-files-found: error
      - name: Fail when the quality gate failed
        if: steps.quality.outcome == 'failure'
        run: exit 1
