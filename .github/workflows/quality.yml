name: Stage 0 quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Install locked development environment
        run: uv sync --locked --all-groups
      - name: Run the repository quality gate
        run: uv run python scripts/run_quality_gate.py
