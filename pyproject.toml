[project]
name = "era-100x"
version = "0.1.0"
description = "Event-driven research foundation for a tightly controlled 100x crypto trading experiment"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "polars>=1.42,<2",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
execution = [
  "nautilus_trader==1.230.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "mypy>=1.16,<2",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
era100x = "era100x.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/era100x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
