[project]
name = "era100x"
version = "0.0.0"
description = "Governed research and engineering workspace for the V1.3.4 specification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "polars>=1.0,<2",
    "pyarrow>=16,<20",
    "pydantic>=2.8,<3",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.25,<2",
    "hypothesis>=6,<7",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/era100x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
